name: flutter_clean_starter
description: "A reusable Flutter starter template: clean architecture, DI, persistence, a fake API, navigation, tests and CI, with a small Tasks sample."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  characters: ^1.4.1
  clock: ^1.1.3
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  go_router: ^18.1.1
  injectable: ^3.0.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  material_ui: ^1.8.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  go_router_builder: ^4.5.2
  injectable_generator: ^3.1.3
  freezed: ^4.0.1
  json_serializable: ^6.15.2
  drift_dev: ^2.35.2
  shared_preferences_platform_interface: ^2.4.2
  fake_async: ^1.3.3
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/json/
