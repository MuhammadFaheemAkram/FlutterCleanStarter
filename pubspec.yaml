name: flutter_clean_starter
description: "A reusable Flutter starter template: clean architecture, DI, persistence, a fake API, navigation, tests and CI, with a small Tasks sample."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  get_it: ^9.3.0
  go_router: ^18.1.1
  injectable: ^3.0.0
  material_ui: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  go_router_builder: ^4.5.2
  injectable_generator: ^3.1.3

flutter:
  uses-material-design: true
